[package]
name = "exercise-import"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"
exercise-domain = { path = "../domain" }
fitparser = "0.12.0"
flate2 = "1.1"
gpx = "0.10.0"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

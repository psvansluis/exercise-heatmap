[build]
# The index HTML file to drive the bundling process.
target = "index.html"
# Build in release mode.
release = false
# Output directory for all generated site files.
dist = "dist"
# Keep the same project-site path locally and on GitHub Pages.

public_url = "/exercise-heatmap/"
# Whether to include hash values in the output file names.
filehash = true
# Whether to inject scripts (and module preloads) into the finalized output.
inject_scripts = true

[watch]
watch = []
ignore = []

[serve]
addresses = ["127.0.0.1"]
port = 3000
open = false



